name: CI

on:
  pull_request:
    branches: [main, dev]
    # Recheck the release source when a PR is retargeted to another base.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.4.1"

jobs:
  branch-flow:
    name: Branch Flow
    runs-on: ubuntu-latest
    env:
      PR_BASE: ${{ github.base_ref }}
      PR_HEAD: ${{ github.head_ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Require releases to come from dev
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$PR_BASE" = "main" ]; then
            if [ "$PR_HEAD" != "dev" ] || [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Release PRs into main must come from this repository's dev branch. Send feature PRs to dev for staging first."
              exit 1
            fi
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @renegade/backend test

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test

  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Test the public-document guard
        run: node --test .github/check-public-documents.test.mjs
      - name: Check tracked public document filenames
        run: node .github/check-public-documents.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check]
    env:
      NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "placeholder"
      NEXT_PUBLIC_SITE_URL: "https://placeholder.com"
      NEXT_PUBLIC_SENTRY_DSN: ""
      CONVEX_DEPLOYMENT: "dev:placeholder"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
